<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>XYZ AI - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #070b14;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 25px;
        }

        .login-box {
            background: #151e32;
            padding: 35px;
            border-radius: 18px;
            border: 1px solid #26314a;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #9ca8c0;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #dce3f2;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 18px;
            border-radius: 10px;
            border: 1px solid #34415f;
            background: #111827;
            color: white;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #4f6cff;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #4f6cff;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #405be0;
        }

        #error {
            color: #ff6b6b;
            text-align: center;
            margin-top: 15px;
            min-height: 20px;
        }

        .demo {
            margin-top: 20px;
            padding: 12px;
            background: #111827;
            border-radius: 10px;
            color: #9ca8c0;
            font-size: 14px;
            text-align: center;
        }
    </style>

</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1>🤖 XYZ AI</h1>

            <p class="subtitle">
                Login to Human AI School Assistant
            </p>

            <form id="loginForm">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
                >

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >

                <button type="submit">
                    Login
                </button>

                <div id="error"></div>

            </form>

            <div class="demo">
                Demo Login: <b>admin</b> / <b>1234</b>
            </div>

        </div>

    </div>


    <!-- JAVASCRIPT MUST BE INSIDE SCRIPT TAG -->

    <script>

        document
            .getElementById("loginForm")
            .addEventListener("submit", login);


        async function login(event) {

            event.preventDefault();

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;

            const error =
                document.getElementById("error");

            error.innerText = "Logging in...";


            try {

                const response = await fetch(
                    "/api/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        credentials: "same-origin",

                        body: JSON.stringify({
                            username: username,
                            password: password
                        })
                    }
                );


                const data =
                    await response.json();


                if (data.success) {

                    window.location.href =
                        "/dashboard";

                } else {

                    error.innerText =
                        data.message || "Login failed";

                }

            }

            catch (error) {

                console.error(error);

                document.getElementById("error").innerText =
                    "Unable to connect to server.";

            }

        }

    </script>

</body>

</html>
